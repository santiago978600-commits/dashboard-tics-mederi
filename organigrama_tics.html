(92):** Alta capacidad para autorregularse y mantener la calma bajo presión.\n*   **Orientación al Logro (88):** Fuerte enfoque en resultados y cumplimiento de objetivos.\n*   **Planeación (87):** Capacidad superior para estructurar actividades y organizar tiempos.\n*   **Practicidad (85):** Enfoque funcional y eficiente para resolver tareas.\n*   **Comunicación Efectiva (83):** Habilidad para transmitir y recibir mensajes con claridad.\n*   **Minuciosidad (91 - Subrasgo DISC):** Extremadamente detallista y precisa en la ejecución.\n\n**Puntajes Medios (Áreas de Ajuste/Funcionales):**\n*   **Precisión (79):** Buen nivel de exactitud, aunque un escalón por debajo de su capacidad de planeación.\n*   **Análisis de la Información (72):** Capacidad adecuada para procesar datos, aunque requiere mayor esfuerzo que la ejecución pura.\n*   **Razonamiento Emocional (67):** Capacidad funcional para entender procesos emocionales lógicos.\n*   **Flexibilidad (65):** Es su competencia corporativa más baja; presenta cierta resistencia al cambio o preferencia por procesos estructurados.\n\n**Puntajes Bajos (Debilidades o Bloqueadores):**\n*   **Comunicación e Influencia Emocional (17):** Gran dificultad para expresar sus sentimientos o conectar emocionalmente para persuadir a otros.\n*   **Entusiasmo y Convencimiento (10 - DISC):** Muy baja tendencia a usar el carisma o la energía emocional para motivar a terceros.\n*   **Autocomprensión emocional (17):** Dificultad para identificar el origen o impacto de sus propias emociones en la toma de decisiones.\n\n---\n\n### 2. Concepto Técnico\n\n**Martha Isabel González** presenta un perfil con un alto potencial de ajuste al cargo (83%), caracterizado por una estructura mental disciplinada, metódica y altamente orientada al cumplimiento de normas y procesos (Minuciosidad 91). Es una colaboradora excepcional para entornos que requieran orden, planeación y ejecución precisa, destacándose por su estabilidad emocional y su capacidad de trabajo en equipo sin generar conflictos. No obstante, posee un perfil marcadamente técnico-administrativo con una restricción significativa en su \"inteligencia emocional social\"; su bajísima capacidad de influencia y comunicación emocional (17) sugiere que es una persona extremadamente reservada, que prefiere no expresar desacuerdos y que carece de habilidades de persuasión carismática. En conclusión, es una candidata ideal para roles operativos o profesionales de soporte donde el rigor y la organización sean la prioridad, pero no se recomienda para posiciones que exijan liderazgo motivacional, ventas o negociaciones de alta carga emocional.", "Tipología": "PROFESIONAL", "Costo_Mensual": 7135192.756}, {"N°": "31", "Identificación": "15683913", "Nombre": "Alex Alberto", "Apellido": "Cantero Herazo", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "PROFESIONAL DE SISTEMAS II", "Fecha de contrato": "2011-03-01", "Edad": "41", "TENER (Estudios)": "**Resumen de Formación Académica: Alex Alberto Cantero Herazo**\n\n*   **Pregrado:** Ingeniero de Sistemas (Finalizado en 05/2023).\n\n*(Nota: La información de la hoja de vida adjunta no fue incluida en este resumen ya que pertenece a una persona distinta: Diego Alexander Castro Piñeros).*", "HACER (Experiencia)": "Basado en la información proporcionada, a continuación se presenta el resumen de la trayectoria laboral de **Alex Alberto Cantero Herazo**:\n\n**Resumen de Experiencia Laboral (HACER):**\nAlex Alberto Cantero Herazo cuenta con una trayectoria profesional de **14 años** en el área de tecnología y sistemas, desempeñando las siguientes funciones:\n\n*   **Soporte Técnico:** 6 años de experiencia en actividades de asistencia técnica.\n*   **Analista de Soporte:** 5 años de experiencia en análisis y resolución de requerimientos de soporte.\n*   **Profesional de Sistemas:** 3 años de experiencia en roles de nivel profesional en el área de sistemas.\n\n*Nota aclaratoria: Se identifica \nAlex Alberto presenta un perfil de **Talento Natural con un ajuste del 71%** para cargos administrativos de nivel profesional, caracterizado por un estilo de comportamiento altamente **prudente, paciente y perseverante**. Es un colaborador analítico y excelente comunicador de información técnica, que aporta estabilidad y rigor a los procesos; sin embargo, su ritmo de ejecución es pausado, ya que prioriza la seguridad sobre la velocidad, lo que se refleja en sus puntuaciones moderadas de planeación y practicidad. Su principal desafío radica en su **baja inteligencia emocional intrapersonal**, pues tiende a reprimir sus emociones y subestimar el impacto de estas en su desempeño, lo que sugiere la necesidad de acompañamiento para mejorar su autoconocimiento y evitar que el estrés se manifieste de forma no verbal o afecte su salud a largo plazo.", "Tipología": "PROFESIONAL", "Costo_Mensual": 0}, {"N°": "34", "Identificación": "1085044088", "Nombre": "Jennyffer", "Apellido": "Herrera Avilez", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "PROFESIONAL DE SISTEMAS II", "Fecha de contrato": "2024-05-20", "Edad": "38", "TENER (Estudios)": "Aquí tienes el resumen estructurado de la formación académica de **Jennyffer Herrera Avilez**:\n\n**Formación Académica (Posgrado y Pregrado):**\n*   **Especialización en Gerencia de Proyectos de Telecomunicaciones:** Politécnico Grancolombiano, 2023.\n*   **Ingeniería en Telecomunicaciones:** Universidad de Pamplona, 2015.\n\n**Otros Estudios y Certificaciones:**\n*   **Diplomado en Teleinformática:** Universidad de Cienfuegos (Cuba), 2015.\n*   **Redes básicas de telecomunicaciones:** IINTITEC, 2022.\n*   **CCNA:** IINTITEC, 2022.\n*   **Servicio al cliente mediante la comunicación telefónica:** SENA, 2016.", "HACER (Experiencia)": "A continuación se presenta el resumen de la trayectoria y experiencia laboral (\"HACER\") de **Jennyffer Herrera Avilez**:\n\n### **Resumen de Experiencia Laboral**\n\nJennyffer Herrera Avilez es Ingeniera en Telecomunicaciones y Especialista en Gerencia de Proyectos con más de **8 años de experiencia** en el sector corporativo, enfocada en redes LAN-WAN, ciberseguridad y soporte técnico. Su perfil técnico destaca por la administración de infraestructura crítica y la gestión operativa en entornos de alta exigencia.\n\n**Principales áreas de desempeño:**\n\n*   **Seguridad y Operaciones de Red (SOC):** Especialista en la administración, instalación y configuración de firewalls **Fortigate**. Experta en la definición de políticas de seguridad, reglas de filtrado, VPNs y gestión de incidentes de seguridad (detección, análisis y resolución) bajo estándares corporativos.\n*   **Gestión de Infraestructura de Red:** Amplia experiencia en configuración y administración de routers, switches y puntos de acceso de múltiples fabricantes, incluyendo **Cisco, Huawei, Juniper, Meraki, Ruckus, Allied Telesis y Raisecom**.\n*   **Implementación de Proyectos:** Ha liderado proyectos de conectividad de gran escala, como la implementación de red para la Registraduría Nacional (elecciones 2019), asegurando la interconexión de repositorios departamentales mediante tecnología Huawei.\n*   **Soporte Técnico y Monitoreo:** Experta en soporte remoto y en sitio para redes LAN/WAN/WLAN, monitoreo de canales de internet y MPLS, y realización de pruebas de conmutación y saturación de enlaces.\n*   **Gestión Administrativa y de Mesa de Ayuda:** Sólida capacidad para la coordinación de personal técnico, gestión de inventarios tecnológicos, documentación de procesos (topologías, diagramas de red) y manejo del ciclo de vida completo de tickets de servicio.\n\n**Experiencia en Méderi: Desde su fecha de contrato (2024-05-20 00:00:00) hasta la actualidad, ha acumulado 0 años y 0 meses de experiencia laboral en Méderi.**", "SER (Competencias)": "A continuación, se presenta el análisis integral de los resultados obtenidos por **Jennyffer Herrera Avilez** en la prueba Psigma para el perfil **SER Administrativo - CIS**.\n\n### 1. Clasificación de Puntajes\n\nDe acuerdo con los resultados cuantitativos, las competencias y dimensiones se clasifican de la siguiente manera:\n\n*   **Puntajes Altos (Fortalezas: 80 - 100):**\n    *   **Razonamiento emocional (100):** Nivel superior en la comprensión de la lógica de las emociones.\n    *   **Planeación (94):** Alta capacidad para estructurar objetivos y organizar actividades.\n    *   **Orientación al Logro (94):** Fuerte enfoque en resultados y cumplimiento de metas.\n    *   **Análisis de la Información (89):** Excelente capacidad para procesar datos y visión global.\n    *   **Practicidad (84):** Alta eficiencia para resolver problemas con autonomía.\n    *   **Manejo Emocional (81):** Buena gestión de sus reacciones internas.\n    *   **Minuciosidad y Autoritarismo (96 - DISC):** Perfil orientado a la estructura, las normas y el mando.\n\n*   **Puntajes Medios (Rango de Expectativa: 60 - 79):**\n    *   **Flexibilidad (78):** Capacidad adecuada para adaptarse a cambios.\n    *   **Comunicación Efectiva (75):** Habilidad para transmitir mensajes, aunque con margen de mejora.\n    *   **Autocomprensión emocional (76) y Comprensión emocional (72).**\n    *   **Trabajo en equipo (70):** Nivel funcional de cooperación colectiva.\n    *   **Influencia emocional (61):** Capacidad moderada para impactar el estado emocional de otros.\n\n*   **Puntajes Bajos (Áreas de Mejora: < 60):**\n    *   **Comunicación emocional (58):** Dificultad para expresar asertivamente lo que siente.\n    *   **Precisión (54):** Es la competencia de cargo más baja; existe tendencia a cometer inconsistencias o pasar por alto detalles en situaciones de urgencia.\n    *   **Subrasgos DISC (10 - 18):** Muy bajos niveles de Convencimiento, Amistad y Entusiasmo, lo que indica un estilo más racional y distante que carismático o persuasivo.\n\n---\n\n### 2. Concepto Técnico\n\nJennyffer Herrera presenta un perfil profesional con un **ajuste al cargo del 82%**, caracterizado por un predominio de competencias cognitivas e intrapersonales de alto nivel. Es una colaboradora estratégica, altamente orientada al logro y con una capacidad superior para la planeación y el análisis de información compleja. Su estilo comportamental (DISC) combina la **Dominancia y el Cumplimiento (D-C)**, lo que la define como una persona disciplinada, autoritaria y enfocada en procesos. Sin embargo, su desempeño podría verse afectado por una baja atención al detalle operativo (**Precisión 54**) y una limitada expresión emocional, lo que sugiere que su liderazgo es más técnico/racional que inspiracional. Es ideal para roles que requieran toma de decisiones basadas en datos y estructuración de proyectos, siempre que cuente con mecanismos de control de calidad para mitigar errores de detalle.", "Tipología": "PROFESIONAL", "Costo_Mensual": 8294031.7319}, {"N°": "35", "Identificación": "1030551708", "Nombre": "Julian Andres", "Apellido": "Ortiz Peña", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "PROFESIONAL DE SISTEMAS II", "Fecha de contrato": "2019-08-12", "Edad": "37", "TENER (Estudios)": "**Resumen de Formación Académica: Julian Andres Ortiz Peña**\n\n*   **Pregrado:** Ingeniería de Sistemas (En curso, finalización prevista: 06/2025).\n*   **Tecnología:** Tecnólogo en Sistemas (Graduado: 02/2013).", "HACER (Experiencia)": "Aquí tienes el resumen de la experiencia laboral (HACER) de Julian Andres Ortiz Peña:\n\n**Resumen de experiencia laboral:**\n\nJulian Andres Ortiz Peña cuenta con una sólida trayectoria profesional de más de 10 años en el área de tecnología y sistemas. Su experiencia se desglosa de la siguiente manera:\n*   **Soporte Técnico:** 8 años y 6 meses dedicados a la asistencia y resolución de incidencias tecnológicas.\n*   **Analista de Soporte:** 1 año de experiencia en el análisis y gestión de requerimientos técnicos.\n*   **Profesional de Sistemas terna de Calidad**, SENA (2020).\n*   **Auditores Internos en SGSI NTC ISO 27001:2013**, Icontec Internacional (2018).\n*   **ISO 9001:2008 Fundamentación de Gestión de la Calidad**, SENA (2014).\n*   **Curso para HSEQ**, Ecapetrol (2010).\n*   **Seminarios Ecapetrol (2010):**\n    *   Riesgos Psicolaboral vs. Accidentalidad.\n    *   Sistemas Integrados de Gestión de Calidad.\n    *   Gestión en Salud Ocupacional (Sector Hidrocarburos).\n    *   Gestión Humana bajo Competencias.\n    *   Gestión Ambiental y Gestión Social (Sector Hidrocarburos).\n    *   Seguridad Industrial para Jefes y Supervisores.", "HACER (Experiencia)": "Aquí tienes el resumen de la experiencia laboral (\"HACER\") de **Zuly Johanna Giraldo Galarza**, basado en la información de su hoja de vida y los datos proporcionados:\n\n### **Resumen de Experiencia Laboral**\n\nZuly Johanna Giraldo Galarza es Ingeniera de Sistemas con una trayectoria sólida de **4 años y 4 meses enfocada específicamente en la Seguridad de la Información**, desempeñándose principalmente como Oficial de Seguridad Informática. Su experiencia se centra en la implementación de normativas internacionales, gestión de riesgos y auditoría de sistemas.\n\n#### **1. Seguridad de la Información (Experiencia Principal)**\nHa trabajado en empresas como **InteliBPO S.A.S.**, **Siglo Data S.A.S.** y **Digicom System Corporation S.A.**, donde ha desarrollado las siguientes funciones:\n*   **Gestión de Normatividad ISO:** Implementación, diseño y mantenimiento del Sistema de Gestión de Seguridad de la Información (SGSI) bajo la norma **ISO 27001:2013** y coordinación de auditorías de calidad bajo **ISO 9001:2015**.\n*   **Análisis de Riesgos:** Aplicación de metodologías para evaluar riesgos de seguridad, operacionales y legales.\n*   **Continuidad y Respuesta:** Diseño e implementación de Planes de Continuidad de Negocio y creación de grupos de respuesta ante incidentes de seguridad (especialmente en entornos de nube).\n*   **Seguridad Técnica:** Realización de escaneos de vulnerabilidades utilizando herramientas como **Nessus** y ejecución de controles de seguridad física y lógica.\n*   **Cumplimiento Legal y Formación:** Gestión de políticas de protección de datos personales y capacitación a colaboradores en temas de ciberseguridad.\n\n#### **2. Otras Experiencias Profesionales**\n*   **Administrativa y Atención al Cliente:** Se ha desempeñado como Administradora en Buffalos Burguer (1 año), Auxiliar Administrativo en el Club Deportivo Leeds Bogotá (2 años) y en atención al cliente en la Registraduría (3 meses). En estos roles desarrolló habilidades de coordinación de grupos, gestión de eventos y relaciones interpersonales.\n\n---\n\nExperiencia en Méderi: Desde su fecha de contrato (2023-03-01 00:00:00) hasta la actualidad, ha acumulado 3 años y 2 meses de experiencia laboral en Méderi.", "SER (Competencias)": "Basado en los resultados de la prueba Psigma para **Zuly Johanna Giraldo Galarza** en el perfil de **Ser Administrativo - CIS**, presento el análisis integral solicitado:\n\n### 1. Clasificación de Puntajes\n\n**Puntajes Altos (Fortalezas Sobresalientes - Nivel Superior/Avanzado):**\n*   **Precisión (100):** Excelencia total en el detalle y la exactitud de las tareas.\n*   **Trabajo en Equipo (100):** Capacidad máxima para colaborar y cooperar hacia metas colectivas.\n*   **Disciplina (100 - Subrasgo DISC):** Rigor absoluto en el seguimiento de normas y procesos.\n*   **Minuciosidad (91):** Alto enfoque en la calidad y revisión de datos.\n*   **Orientación al Logro (89) y Practicidad (89):** Enfoque efectivo hacia resultados concretos mediante soluciones funcionales.\n*   **Manejo Emocional (86):** Buena capacidad para mantener la compostura en entornos laborales.\n\n**Puntajes Medios (Competencias en Rango de Expectativa/Desarrollo):**\n*   **Flexibilidad (78):** Capacidad adecuada para adaptarse a cambios, aunque prefiere la estructura.\n*   **Comunicación Efectiva (78):** Habilidad está  soporte técnico-administrativo en equipo.", "Tipología": "PROFESIONAL", "Costo_Mensual": 7135192.756}, {"N°": "22", "Identificación": "1013623510", "Nombre": "Cindy Jeraldin", "Apellido": "Martin Llanos", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "PROFESIONAL DE SISTEMAS JUNIOR", "Fecha de contrato": "2025-02-03", "Edad": "34", "TENER (Estudios)": "**Resumen de Formación Académica:**\n\n*   **Pregrado:** Ingeniería de Sistemas (2017).\n*   **Otros estudios:** No se registra información adicional en el texto proporcionado.", "HACER (Experiencia)": "Basado en la información proporcionada, este es el resumen de la experiencia laboral (HACER) de **Cindy Jeraldin Martin Llanos**:\n\n**Resumen de Experiencia Laboral**\n\nCindy Jeraldin cuenta con una sólida trayectoria profesional de más de 12 años en áreas operativas y de asistencia técnica. Su experiencia se divide principalmente en dos roles clave:\n*   **Soporte:** Ha desempeñado funciones en esta área durante **10 años y 8 meses**, lo que demuestra una alta especialización en atención, resolución de incidencias y acompañamiento técnico.\n*   **Administración de Niveles:** Cuenta con **2 años** de experiencia gestionando niveles administrativos, complementando su perfil técnico con capacidades de gestión y organización.\n\nEn total, su bagaje profesional previo suma 12 años y 8 months de experiencia comprobable en el sector.\n\nExperiencia en Méderi: Desde su fecha de contrato (2025-02-03 00:00:00) hasta la actualidad, ha acumulado 1 años y 3 meses de experiencia laboral en Méderi.", "SER (Competencias)": "A continuación se presenta el análisis integral de las competencias de **Cindy Jeraldin Martin Llanos**, basado en los resultados de la prueba Psigma para el perfil **SER ADMINISTRATIVO - CIS**.\n\n### 1. Clasificación de Puntajes\n\nDe acuerdo con los resultados cuantitativos, las competencias se categorizan de la siguiente manera:\n\n*   **Puntajes Altos (Fortalezas: da a los cambios de entorno.\n*   **Trabajo en Equipo (60):** Disposición cooperativa, aunque con una marcada tendencia a la ejecución individual o técnica.\n*   **Inteligencia Emocional (Promedio 55):** Posee autocomprensión básica, pero presenta oportunidades de mejora en la gestión de emociones complejas.\n\n**Puntajes Bajos (Debilidades: Menor a 50):**\n*   **Comunicación Efectiva (39):** Es la brecha más crítica. Presenta dificultades significativas para transmitir ideas de forma asertiva, influir en otros o expresar estados emocionales de manera clara.\n\n---\n\n### 2. Concepto Técnico\n\nMaría Auxiliadora presenta un perfil técnico-administrativo altamente confiable, caracterizado por un estilo comportamental de alta estabilidad (S) y cumplimiento (C). Su talento natural destaca en la ejecución de procesos que requieren minuciosidad, orden, análisis de datos y una notable capacidad de resistencia al estrés mediante la paciencia y la perseverancia. Posee un ajuste al perfil del 71%, lo que la posiciona como una colaboradora disciplinada que garantiza la calidad técnica y el seguimiento de normas. No obstante, su desempeño se ve limitado en dimensiones relacionales; su baja puntuación en comunicación efectiva e influencia sugiere que prefiere roles de soporte operativo donde el contacto interpersonal o la negociación no sean el eje central, requiriendo apoyo para desarrollar habilidades de comunicación asertiva y expresión emocional en el entorno laboral.", "Tipología": "PROFESIONAL", "Costo_Mensual": 9344509.0046}, {"N°": "1", "Identificación": "80876641", "Nombre": "Javier Andres", "Apellido": "Rojas Muñoz", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "ANALISTA DE SOPORTE", "Fecha de contrato": "2022-10-04", "Edad": "40", "TENER (Estudios)": "Aquí tienes el resumen estructurado de la formación académica de **JAVIER ANDRÉS Rojas Muñoz**:\n\n**Formación Académica (Pregrado)**\n*   **Tecnología en Sistemas**: Fundació oma de riesgos o al control directo.\n\n---\n\n### 2. Concepto Técnico\n\nJavier Andrés presenta un **ajuste al perfil del 82%**, lo que lo califica como un candidato altamente competente para el cargo de **Analista**. Su perfil destaca por una excepcional capacidad analítica, rigor técnico y un enfoque en la calidad (Minuciosidad 94), siendo ideal para tareas que requieran precisión y seguimiento de procesos estructurados. Posee una estructura interna sumamente estable con niveles óptimos de autorregulación y autocomprensión emocional (100); sin embargo, su principal oportunidad de mejora reside en la **comunicación emocional (50)** y la **practicidad (64)**, sugiriendo que puede tener dificultades para expresar sus sentimientos de forma asertiva o para priorizar la rapidez sobre el perfeccionismo. En conclusión, es un profesional disciplinado, prudente y orientado al logro, que aporta confiabilidad y análisis detallado al equipo de trabajo.", "Tipología": "ANALISTA / TECNOLOGO", "Costo_Mensual": 4590416.4405}, {"N°": "3", "Identificación": "1023023552", "Nombre": "Jeili Yojana", "Apellido": "Gutierrez Sanchez", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "AUXILIAR DE ENFERMERIA SERVINTE", "Fecha de contrato": "2025-04-14", "Edad": "28", "TENER (Estudios)": "**Formación Académica:**\n\n*   **Tecnología en Gestión de Procesos Administrativos en Salud**, SENA (2021).\n*   **Técnica Laboral en Auxiliar de Enfermería**, Escuela de Enfermería San Rafael (2016).\n*   **Bachiller Académico**, IED Francisco Antonio Zea de Usme (2014).\n\n**Estudios Complementarios:**\n\n*   **Formación Complementaria en Humanización de la Atención en Salud**, SENA (2021).\n*   **Curso Soporte Vital Básico**, Escuela de Enfermería San Rafael (2016).\n*   **Taller Competencias Transversales**, Compensar (2016).", "HACER (Experiencia)": "Aquí tienes el resumen de la experiencia laboral (\"HACER\") de **Jeili Yojana Gutiérrez Sánchez**, basado en la información proporcionada:\n\n**Resumen de Experiencia Laboral**\n\nJeili Yojana cuenta con una trayectoria sólida de más de **8 años en el sector salud**, equilibrando funciones asistenciales y administrativas. Su experiencia se desglosa de la siguiente manera:\n\n*   **Área Administrativa (4 años):** Se ha desempeñado como Auxiliar de Servicio al Cliente en **Compensar (2024)** y como Auxiliar Administrativa de Soporte Clínico TIC en **Méderi (2020-2023)**. En estos roles, ha liderado procesos de facturación, autorización de servicios de salud, agendamiento de citas, elaboración de reportes de gestión y soporte sistemático a usuarios internos y externos. Posee un manejo avanzado del aplicativo Servinte y herramientas de Office.\n*   **Área Asistencial (4 años):** Trabajó como Auxiliar de Enfermería en la **Corporación Hospitalaria Juan Ciudad - Méderi (2016-2020)**. Sus funciones incluyeron el cuidado directo y apoyo al paciente, registro de notas clínicas, gestión documental de historias clínicas, afiliaciones y verificación de derechos ante las EPS.\n\nEn conjunto, su perfil integra el conocimiento técnico de enfermería con la eficiencia en la gestión de procesos administrativos en salud.\n\nExperiencia en Méderi: Desde su fecha de contrato (2025-04-14 00:00:00) hasta la actualidad, ha acumulado 1 años y 1 meses de experiencia laboral en Méderi.", "SER (Competencias)": "Basado en los resultados de las pruebas Psigma de **Jeili Yojana Gutiérrez Sánchez** para el cargo de Auxiliar (SER Administrativo - CIS), presento el análisis solicitado:\n\n### 1. Clasificación de Puntajes\n\n**Puntajes Altos (Fortalezas):**\n*   **Inteligencia Emocional:** Destacan la **Regulación emocional (100)** y la **Autocomprensión emocional (95)**, indicando un control superior de sus reacciones.\n*   **Trabajo en equipo (78):** Alta disposición para colaborar y cooperar en metas colectivas.\n*   **Manejo Emocional (75):** Capacidad para mantener la calma en situaciones de presión.\n*   **Disciplina (74) y Paciencia (73):** Subrasgos del DISC que sugieren persistencia y respeto por las normas.\n*   **Flexibilidad (70):** Buena adaptabilidad a los cambios del entorno laboral.\n\n**Puntajes Medios (En rango esperado/Por mejorar):**\n*   **Orientación al Logro (61):** Capacidad funcional para alcanzar objetivos, aunque con margen de crecimiento.\n*   **Practicidad (60):** Resolución de problemas de forma rápida, pero requiere supervisión en la calidad final.\n*   **Precisión (56):** Ejecución correcta de tareas, con posibles omisiones de detalles en momentos de urgencia.\n*   **Comunicación Efectiva (52):** Habilidad social básica; intenta influir en otros, pero no siempre lo logra con éxito.\n*   **Análisis de la Información (50):** Nivel básico para procesar datos; puede pasar por alto detalles clave en la toma de decisiones.\n\n**Puntajes Bajos (Oportunidades de mejora):**\n*   **Planeación (36):** Es la debilidad más crítica; presenta dificultades para organizar labores en proyectos prioritarios y estructurar el tiempo.\n*   **Competencias Cognitivas (Global: 43):** Dificultad para el pensamiento crítico profundo y la organización de procesos complejos.\n\n---\n\n### 2. Concepto Técnico\n\nJeili Gutiérrez presenta un perfil con un **ajuste al cargo del 65.47%**, caracterizado por una **excelente estabilidad emocional y habilidades intrapersonales**, lo que la posiciona como una colaboradora confiable, disciplinada y altamente cooperativa en equipos de trabajo. Su \"Talento Natural\" está volcado hacia la ejecución operativa y el apoyo social, apoyado en una autogestión emocional sobresaliente que minimiza conductas problemáticas bajo estrés (solo 19% de riesgo). No obstante, su desempeño se ve limitado por una **baja capacidad de planeación y análisis profundo**, lo que sugiere que es más eficiente en tareas de rutina clara y apoyo administrativo que en roles que exijan autonomía estratégica o gestión de proyectos complejos. Se recomienda acompa ormación (41):** Capacidad operativa funcional, pero con tendencia a omitir detalles profundos.\n\n**Puntajes Bajos (Debilidades / Áreas Críticas: <40%)**\n*   **Planeación (36):** Dificultad para organizar tareas complejas o priorizar proyectos a largo plazo.\n*   **Comprensión emocional (33):** Reto para entender las causas de las emociones en los demás.\n*   **Precisión (32):** Marcada debilidad en tareas que requieren minuciosidad, detalle técnico y rigor administrativo.\n*   **Comunicación emocional (17):** Gran dificultad para expresar verbalmente lo que siente o sus inconformidades.\n\n---\n\n### 2. Concepto Técnico\n\nEl candidato presenta un **ajuste del 61%** para el cargo de Auxiliar Administrativo, perfilándose como un colaborador con un **Talento Natural predominantemente social e intrapersonal**. Destaca por su alta inteligencia emocional en el área de autorregulación, su disciplina y su excelente disposición para el trabajo en equipo, lo que lo convierte en un elemento valioso para el clima organizacional y la ejecución de tareas operativas inmediatas. No obstante, muestra **brechas críticas en competencias técnicas de ejecución**, específicamente en precisión, planeación y análisis de información; su estilo tiende a ser práctico pero poco detallista, lo que podría derivar en errores en procesos que exijan un alto rigor administrativo. Se recomienda supervisión en tareas de archivo, contabilidad o planeación detallada, potenciando su rol en áreas donde la cooperación y el servicio sean los ejes principales.", "Tipología": "AUXILIAR / TÉCNICO", "Costo_Mensual": 3030365.736}, {"N°": "2", "Identificación": "1233905843", "Nombre": "Mary Angela", "Apellido": "Paez Rincon", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "AUXILIAR DE ENFERMERIA SERVINTE", "Fecha de contrato": "2023-04-15", "Edad": "27", "TENER (Estudios)": "**Formación Académica: Mary Angela Paez Rincon**\n\n*   **Técnico:** Auxiliar en Enfermería (F tad para aceptar puntos de vista ajenos o adaptarse a procedimientos nuevos.\n*   **Comunicación Emocional (58):** Dificultad para expresar de forma asertiva lo que siente, especialmente en situaciones de alta tensión.\n\n---\n\n### 2. Concepto Técnico Administrativo\n\nTeresa presenta un perfil con un **ajuste del 64.54%** para el cargo administrativo, caracterizándose por ser una colaboradora **ejecutiva, disciplinada y emocionalmente estable**. Su mayor valor reside en su capacidad para resolver contingencias de forma práctica y mantener un clima laboral armonioso gracias a su alto control emocional y paciencia. No obstante, su desempeño en tareas administrativas críticas podría verse afectado por su **bajo nivel de precisión y análisis**, lo que sugiere un riesgo de errores en el manejo de datos o documentos detallados. Asimismo, su marcada resistencia a la flexibilidad indica que requiere procesos estables y claros, ya que los entornos de cambio constante podrían generarle bloqueos. Es una candidata apta para tareas operativas recurrentes, pero requiere supervisión en la revisión de calidad y apoyo para fortalecer su comunicación asertiva y adaptabilidad.", "Tipología": "AUXILIAR / TÉCNICO", "Costo_Mensual": 3030365.736}, {"N°": "9", "Identificación": "1082124651", "Nombre": "Anibal Esteven", "Apellido": "Cuellar Romero", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "SOPORTE TECNICO", "Fecha de contrato": "2023-01-12", "Edad": "21", "TENER (Estudios)": "**Formación Académica y Estudios: Anibal Esteven Cuellar Romero**\n\n*   **Técnico en Sistemas** (2022)", "HACER (Experiencia)": "Aquí tienes el resumen de la experiencia laboral de **Aníbal Esteven Cuellar Romero**:\n\n**Resumen de Experiencia Laboral**\n\nAníbal Esteven cuenta con una trayectoria en el área técnica, sumando 7 meses de experiencia previa enfocada específicamente en el **mantenimiento de software y hardware**. Adicionalmente, su perfil se complementa c o de Equipos de Cómputo (2023):** Responsable del soporte técnico a hardware (computadoras e impresoras) y de la gestión administrativa mediante la plataforma DrivERP, donde generaba facturación para clientes corporativos de telecomunicaciones como Claro y Movistar.\n\nEn conjunto, su experiencia suma aproximadamente un año de labores enfocadas en la eficiencia operativa, el cumplimiento de políticas empresariales y la resolución de incidencias tecnológicas.\n\nExperiencia en Méderi: Desde su fecha de contrato (2025-02-10 00:00:00) hasta la actualidad, ha acumulado 1 años y 3 meses de experiencia laboral en Méderi.", "SER (Competencias)": "Basado en el informe de la prueba Psigma para **Carlos Efrain Ospino Cuello**, se presenta el siguiente análisis integral:\n\n### 1. Clasificación de Puntajes\n\n**Puntajes Altos (Fortalezas: >70)**\n*   **Precisión (87):** Nivel superior; excelente capacidad para el detalle y la minuciosidad.\n*   **Orientación al Logro (80):** Alta motivación para cumplir objetivos y exigencia personal.\n*   **Análisis de la Información (76):** Gran capacidad para procesar datos y pensar de forma crítica.\n*   **Planeación (75):** Estructurado, organizado y precavido en sus labores.\n*   **Disciplina (75):** Fuerte apego a las normas y procedimientos.\n*   **Regulación Emocional (72) y Autocomprensión (71):** Buen control de sus impulsos y conocimiento de sus estados internos.\n\n**Puntajes Medios (En desarrollo: 50 - 69)**\n*   **Manejo Emocional (70):** Adecuado, aunque con matices en la expresión.\n*   **Practicidad (64):** Capacidad funcional para resolver situaciones concretas.\n*   **Comunicación Efectiva (64):** Comprende mensajes y adapta el discurso, pero tiene limitaciones expresivas.\n*   **Amistad y Paciencia (70-67):** Rasgos sociales equilibrados en contextos conocidos.\n\n**Puntajes Bajos (Áreas de Mejora / Bloqueadores: <50)**\n*   **Comunicación Emocional (14):** Puntaje críticamente bajo; extrema dificultad para expresar verbalmente lo que siente, lo que puede generar fugas de lenguaje no verbal inadecuadas.\n*   **Flexibilidad (44):** Rigidez ante los cambios; le cuesta acoplarse a nuevos procedimientos.\n*   **Trabajo en Equipo (45):** Tendencia a trabajar de forma individual; puede mostrarse evasivo ante conflictos grupales.\n*   **Influencia Emocional (39):** Poca capacidad para impactar o movilizar a otros desde la emocionalidad.\n*   **Dominancia/Autoritarismo (29-30):** Perfil sumiso o con baja iniciativa para el mando y la toma de decisiones drásticas.\n\n---\n\n### 2. Concepto Técnico\n\nEl candidato presenta un perfil técnico-ejecutor de alta eficiencia para cargos administrativos que requieran **rigor, análisis y seguimiento de procesos**, con un ajuste al cargo del **68%**. Su talento natural destaca por la precisión técnica y la disciplina operativa, siendo un colaborador confiable en tareas que exigen orden y atención al detalle. No obstante, su desempeño puede verse limitado en entornos dinámicos debido a su baja **flexibilidad y resistencia al cambio**. Su mayor debilidad reside en el área social y comunicativa: posee una marcada dificultad para expresar sus emociones y necesidades de manera asertiva (comunicación emocional de 14), lo que podría generar tensiones internas o malentendidos en el equipo. Es un perfil ideal para labores de soporte y back-office, pero requiere acompañamiento en el desarrollo de habilidades blandas, especialmente en la integración grupal y la adaptación a nuevas metodologías.", "Tipología": "AUXILIAR / TÉCNICO", "Costo_Mensual": 3790162.0236}, {"N°": "6", "Identificación": "1000007635", "Nombre": "Daiver", "Apellido": "Idrobo Vasquez", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "SOPORTE TECNICO", "Fecha de contrato": "2024-10-01", "Edad": "23", "TENER (Estudios)": "**Formación Académica y Estudios:**\n\n*   **Pregrado:** Ingeniería de Sistemas (9.° semestre / en formación), Institución Universitaria rabajo en Equipo (68):** Colabora activamente con el grupo.\n*   **Comunicación Efectiva (63):** Logra transmitir ideas, aunque con margen de mejora.\n*   **Practicidad (63):** Capacidad funcional para resolver problemas, aunque a veces requiere revisión.\n*   **Manejo Emocional (54):** Nivel básico de control sobre sus emociones en el entorno laboral.\n\n**Puntajes Bajos (Áreas Críticas/Riesgo: <50)**\n*   **Precisión (48):** Es su debilidad técnica más importante; tiende a pasar por alto detalles minuciosos o cometer errores en tareas que requieren excesivo rigor.\n*   **Comunicación Emocional (33):** Dificultad para expresar lo que siente de forma asertiva.\n*   **Razonamiento Emocional (33):** Limitada capacidad para integrar las emociones en la toma de decisiones lógica.\n*   **Dominancia (DISC D: 15/20):** Muy baja tendencia al mando o a la confrontación directa.\n\n---\n\n### 2. Concepto Técnico\n\nDaiver presenta un potencial de ajuste al cargo del **70%**, caracterizándose por un perfil de **Talento Natural orientado a la estabilidad, la organización y el apoyo (perfil DISC con alta S)**. Es un colaborador altamente disciplinado, paciente y adaptable, lo que lo hace ideal para entornos de trabajo colaborativos y procesos que requieran seguimiento de normas y planificación previa. Sin embargo, su desempeño puede verse comprometido en tareas de alta exigencia de detalle debido a su bajo nivel de **Precisión (48)** y en situaciones de alta presión emocional, ya que cuenta con bloqueadores significativos (38%) y una baja capacidad de **razonamiento y comunicación emocional (33)**. En conclusión, es un perfil administrativo confiable para la ejecución organizada, pero requiere supervisión en la revisión final de datos técnicos y acompañamiento en el desarrollo de su inteligencia emocional para evitar que el estrés afecte su productividad.", "Tipología": "AUXILIAR / TÉCNICO", "Costo_Mensual": 3790162.0236}, {"N°": "10", "Identificación": "1033740419", "Nombre": " n de Iluminación (Star LED de Colombia):** Trabajó durante **7 meses** como Técnico Operario en luminarias, donde se encargó del manejo de maquinaria de producción, diagnóstico y reparación de circuitos en PCB, y montaje de componentes LED.\n3.  **Mantenimiento Eléctrico Industrial (Comestibles Italo S.A.):** Realizó su etapa productiva (6 meses) como Auxiliar de Mantenimiento Eléctrico, enfocándose en la reparación de fallas en maquinaria de producción, diseño y construcción de tableros eléctricos y ejecución de planes de mantenimiento preventivo y predictivo.\n\nExperiencia en Méderi: Desde su fecha de contrato (2023-05-02 00:00:00) hasta la actualidad, ha acumulado 3 años y 0 meses de experiencia laboral en Méderi.", "SER (Competencias)": "Tras un análisis integral de los resultados obtenidos por **Diego Alexander Castro Piñeros** en la prueba Psigma para el cargo de Auxiliar (SER Administrativo - CIS), se presenta el siguiente desglose:\n\n### 1. Clasificación de Puntajes\n\n**Puntajes Altos (Fortalezas: >75)**\n*   **Manejo Emocional (84):** Gran capacidad para mantener la calma y la estabilidad bajo presión.\n*   **Practicidad (84):** Alta orientación a resultados tangibles y resolución de tareas concretas.\n*   **Autocomprensión Emocional (81):** Excelente conocimiento de sus propias reacciones y estados internos.\n*   **Razonamiento Emocional (80):** Habilidad para entender la lógica de las emociones en situaciones complejas.\n*   **Precisión (79):** Rigurosidad y atención al detalle en la ejecución de sus labores.\n*   **Análisis de la Información (77):** Capacidad para procesar datos y esquemas con facilidad.\n*   **Disciplina y Amistad (Subrasgos DISC: 77):** Perfil metódico, confiable y con disposición cordial.\n\n**Puntajes Medios (En desarrollo: 60 - 74)**\n*   **Comunicación Efectiva (72):** Capacidad adecuada para transmitir ideas, aunque con margen de mejora en la asertividad.\n*   **Paciencia (Subrasgo DISC: 70):** Buen nivel de tolerancia en tareas rutinarias.\n*   **Orientación al Logro (68):** Motivación funcional hacia las metas, aunque prefiere parámetros claros.\n*   **Regulación Emocional (67):** Control aceptable de sus impulsos emocionales.\n*   **Trabajo en Equipo (62):** Colaboración funcional, aunque tiende a ser más individualista o reservado.\n\n**Puntajes Bajos (Debilidades/Áreas de Mejora: <60)**\n*   **Planeación (57):** Dificultad para priorizar múltiples tareas o gestionar proyectos complejos a largo plazo.\n*   **Flexibilidad (56):** Resistencia al cambio y dificultad para adaptarse a situaciones imprevistas o nuevas metodologías.\n*   **Comprensión Emocional (56):** Limitación para interpretar profundamente los sentimientos ajenos.\n*   **Comunicación Emocional (50):** Marcada dificultad para expresar verbalmente sus emociones o necesidades de forma asertiva.\n\n---\n\n### 2. Concepto Técnico\n\nDiego Alexander presenta un perfil de **\"Ejecutor Estable y Metódico\"**, con un ajuste al cargo del **71%**. Destaca por su alta confiabilidad operativa, precisión técnica y un notable manejo del estrés, lo que lo hace ideal para tareas administrativas que requieran rigor y seguimiento de normas. Posee una estructura de pensamiento práctica y una excelente autocomprensión emocional; sin embargo, su desempeño puede verse limitado ante cambios súbitos en el entorno o cuando se requiere una planificación autónoma de prioridades. Su principal oportunidad de mejora reside en la flexibilidad cognitiva y la comunicación asertiva de sus emociones, ya que tiende a ser reservado y rígido en sus procesos, lo que sugiere que funciona mejor en entornos estructurados con directrices claras y baja ambigüedad.", "Tipología": "AUXILIAR / TÉCNICO", "Costo_Mensual": 3790162.0236}, {"N°": "12", "Identificación": "1127957236", "Nombre": "Jose David", "Apellido": "Gualdron Gualdron", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "SOPORTE TECNICO", "Fecha de contrato": "2023- ión Emocional (81):** Elevado conocimiento de sus propias reacciones fisiológicas y emocionales.\n*   **Subrasgos DISC:** Paciencia (98), Perseverancia (95) y Prudencia (92). Indican un perfil altamente estable, constante y cauteloso.\n\n**Puntajes Medios (Rango Promedio: 50 - 74)**\n*   **Flexibilidad (70):** Capacidad adecuada para adaptarse a cambios y nuevos requerimientos.\n*   **Trabajo en Equipo (64):** Disposición para colaborar y cooperar hacia metas colectivas.\n*   **Comunicación Efectiva (63):** Habilidad estándar para transmitir y comprender mensajes.\n*   **Practicidad (56):** Nivel funcional para concretar planes, aunque con margen de mejora en la ejecución.\n*   **Orientación al Logro (54):** Motivación por los resultados dentro de los parámetros normales.\n*   **Comunicación Emocional (50):** Capacidad limítrofe para expresar lo que siente de forma asertiva.\n\n**Puntajes Bajos (Áreas de Mejora: 0 - 49)**\n*   **Precisión (35):** Dificultad para mantener estándares de calidad y detalle bajo presión o en tareas minuciosas.\n*   **Manejo Emocional (34):** Bajo control de sentimientos ante situaciones adversas o de alto estrés.\n*   **Competencias de Ejecución (45.50):** Promedio general bajo en la transformación de la intención en hechos concretos con exactitud.\n\n---\n\n### 2. Concepto Técnico\n\nJose David presenta un perfil con un **ajuste al cargo del 62%**, caracterizado por un potencial cognitivo sobresaliente en tareas de **planeación, organización y análisis estratégico**, lo que lo convierte en un colaborador metódico y precavido. Su estilo comportamental (DISC) es predominantemente estable (Alta S), destacándose por su excepcional paciencia y perseverancia; sin embargo, muestra debilidades críticas en la **precisión operativa y el manejo emocional**, lo que sugiere que, aunque estructura muy bien el trabajo, puede fallar en el detalle final o verse desbordado ante situaciones de alta presión emocional. Es un candidato ideal para procesos que requieran seguimiento de métodos y visión organizada, pero requiere acompañamiento en el desarrollo de su inteligencia emocional asertiva y en la rigurosidad técnica de sus entregables.", "Tipología": "AUXILIAR / TÉCNICO", "Costo_Mensual": 3790162.0236}, {"N°": "11", "Identificación": "1023962036", "Nombre": "Santiago", "Apellido": "Ordoñez Barrantes", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descripción del cargo": "SOPORTE TECNICO", "Fecha de contrato": "2025-01-20", "Edad": "28", "TENER (Estudios)": "**Resumen de Formación Académica: Santiago Ordoñez Barrantes**\n\n*   **Educación Superior:** Tecnólogo en Mantenimiento de Equipos de Cómputo.", "HACER (Experiencia)": "Aquí tienes el resumen de la experiencia laboral de **Santiago Ordóñez Barrantes**:\n\n**Resumen de experiencia previa:**\nSantiago cuenta con una trayectoria sólida de **5 años** en el área de **soporte y monitoreo de análisis**. Su experiencia se centra en la supervisión técnica, el seguimiento de procesos de datos y la resolución de incidencias, asegurando la continuidad operativa y la calidad en el análisis de información dentro de entornos corporativos.\n\nExperiencia en Méderi: Desde su fecha de contrato (2025-01-20 00:00:00) hasta la actualidad, ha acumulado 1 años y 3 meses de experiencia laboral en Méderi.", "SER (Competencias)": "Basado en los resultados de la prueba Psigma de **Santiago Ordoñez Barrantes**, presento el análisis integral de sus competencias:\n\n### 1. Clasificación de Puntajes\n\n**Puntajes Altos (Fortalezas):**\n*   **Orientación al Logro (99):** Nivel superior; alta automotivación y enfoque en superar metas.\n*   **Disciplina (88) y Minuciosidad (80):** Gran capacidad para seguir normas y atender detalles.\n*   **Trabajo en equipo (86):** Alta disposición para colaborar y cooperar con otros.\n*   **Practicidad (80):** Capacidad de resolver problemas con rapidez y autonomía.\n*   **Paciencia (77) y Comunicación Efectiva (75):** Estabilidad en el trato y claridad al transmitir ideas.\n\n**Puntajes Medios (Áreas de observación):**\n*   **Planeación (68):** Capacidad adecuada para organizar tareas, aunque mejorable.\n*   **Flexibilidad (57):** Adaptación moderada a los cambios.\n*   **Precisión (56):** Ejecución correcta, pero con margen de error en situaciones de urgencia.\n*   **Manejo Emocional (54):** Capacidad estándar para controlar sentimientos bajo presión.\n\n**Puntajes Bajos (Debilidades/Riesgos):**\n*   **Análisis de la Información (28):** Dificultad marcada para procesar datos complejos o situaciones abstractas.\n*   **Comunicación emocional (10):** Muy baja capacidad para expresar sus propios estados emocionales o sentimientos de forma asertiva.\n*   **Autocomprensión emocional (48):** Dificultad para identificar cómo sus emociones influyen en sus decisiones.\n\n---\n\n### 2. Concepto Técnico\n\nSantiago presenta un perfil de **ejecutor operativo altamente eficiente y disciplinado**, con un ajuste global al cargo del **68.26%**. Su mayor activo es la orientación al resultado y el cumplimiento de normas (Disciplina y Minuciosidad), lo que lo hace ideal para tareas administrativas estandarizadas donde se requiere orden y seguimiento de procesos. No obstante, posee una limitación crítica en el **análisis de información compleja** y en la **comunicación emocional**, lo que sugiere que su desempeño será óptimo en funciones claras y rutinarias, pero podría verse comprometido en roles que exijan toma de decisiones basadas en datos profundos o en situaciones que requieran una alta gestión de relaciones interpersonales sensibles. Es un colaborador confiable para el trabajo en equipo, pero requiere supervisión en tareas de carácter analítico o de alta carga de incertidumbre.", "Tipología": "AUXILIAR / TÉCNICO", "Costo_Mensual": 3790162.0236}, {"N°": "7", "Identificación": "1013649283", "Nombre": "Yesica Lorena", "Apellido": "Niño Peña", "Proceso": "Tecnología de la Información y las Comunicaciones", "Descrip
